<polygon points="1987,355 2005,365 1987,375" fill="#276487"/>
<text x="1326" y="340" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#192b37">2. Lock active tab input</text>
<line x1="648" y1="515" x2="2005" y2="515" stroke="#276487" stroke-width="3"/>
<polygon points="1987,505 2005,515 1987,525" fill="#276487"/>
<text x="1326" y="490" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#192b37">3. Extract semantic page state</text>
<line x1="2005" y1="605" x2="648" y2="605" stroke="#517c95" stroke-width="3" stroke-dasharray="12 8"/>
<polygon points="666,595 648,605 666,615" fill="#517c95"/>
<text x="1326" y="580" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#192b37">4. Page state</text>
<line x1="648" y1="695" x2="1100" y2="695" stroke="#276487" stroke-width="3"/>
<polygon points="1082,685 1100,695 1082,705" fill="#276487"/>
<text x="874" y="670" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#192b37">5. POST /agent/plan</text>
<line x1="1100" y1="785" x2="1552" y2="785" stroke="#276487" stroke-width="3"/>
<polygon points="1534,775 1552,785 1534,795" fill="#276487"/>
<text x="1326" y="760" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#192b37">6. Request action plan</text>
<line x1="1552" y1="875" x2="1100" y2="875" stroke="#517c95" stroke-width="3" stroke-dasharray="12 8"/>
<polygon points="1118,865 1100,875 1118,885" fill="#517c95"/>
<text x="1326" y="850" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#192b37">7. Proposed actions</text>
<line x1="1100" y1="965" x2="648" y2="965" stroke="#517c95" stroke-width="3" stroke-dasharray="12 8"/>
<polygon points="666,955 648,965 666,975" fill="#517c95"/>
<text x="874" y="940" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#192b37">8. Validated action queue</text>
<line x1="648" y1="1100" x2="195" y2="1100" stroke="#276487" stroke-width="3"/>
<polygon points="213,1090 195,1100 213,1110" fill="#276487"/>
<text x="421" y="1075" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#192b37">9. Request approval</text>
<line x1="195" y1="1185" x2="648" y2="1185" stroke="#517c95" stroke-width="3" stroke-dasharray="12 8"/>
<polygon points="630,1175 648,1185 630,1195" fill="#517c95"/>
<text x="421" y="1160" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#192b37">10. Approve or decline</text>
<line x1="648" y1="1290" x2="2005" y2="1290" stroke="#276487" stroke-width="3"/>
<polygon points="1987,1280 2005,1290 1987,1300" fill="#276487"/>
<text x="1326" y="1265" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#192b37">11. Invoke action if approved</text>
<line x1="2005" y1="1380" x2="648" y2="1380" stroke="#517c95" stroke-width="3" stroke-dasharray="12 8"/>
<polygon points="666,1370 648,1380 666,1390" fill="#517c95"/>
<text x="1326" y="1355" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#192b37">12. Outcome and verification</text>
<polyline points="648,1458 783,1458 783,1487 648,1487" fill="none" stroke="#276487" stroke-width="3"/>
<polygon points="665,1478 648,1487 665,1496" fill="#276487"/>
<text x="633" y="1430" text-anchor="end" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#192b37">13. Update memory</text>
<line x1="648" y1="1570" x2="2005" y2="1570" stroke="#276487" stroke-width="3"/>
<polygon points="1987,1560 2005,1570 1987,1580" fill="#276487"/>
<text x="1326" y="1545" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#192b37">14. Unlock tab at task end</text>
<line x1="648" y1="1660" x2="195" y2="1660" stroke="#517c95" stroke-width="3" stroke-dasharray="12 8"/>
<polygon points="213,1650 195,1660 213,1670" fill="#517c95"/>
<text x="421" y="1635" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#192b37">15. Display final result</text>
<text x="1100" y="1748" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#4e606b">Declining approval ends the task; no action is dispatched.</text>
<text x="1100" y="1781" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#4e606b">The goal and page state are not automatically injection-classified.</text>
</svg>