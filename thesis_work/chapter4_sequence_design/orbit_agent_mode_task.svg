<polygon points="630,264 648,274 630,284" fill="#276487"/>
<text x="421" y="249" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#192b37">1. Submit goal</text>
