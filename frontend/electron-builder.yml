# electron-builder configuration for PromptGuard.
#
# The `build` key in package.json is already taken by an npm script, so
# electron-builder is configured from this file instead.
#
# The Node/Fastify backend is shipped as an unpacked resource
# (resources/backend/dist + its node_modules) and launched at runtime by
# frontend/electron/backendProcess.ts using Electron's bundled Node
# (ELECTRON_RUN_AS_NODE) — the installed app needs no system Node, Python,
# pip, FastAPI, Uvicorn, Playwright or scikit-learn.
#
# Run with:  npm run package        (full NSIS installer)
#            npm run package:dir    (unpacked app dir, for smoke testing)
#
# Both run `npm run package:stage` first (scripts/stage-backend.mjs), which
# builds build/backend: the compiled server plus only its production
# dependencies and this platform's onnxruntime-node binary. That is what gets
# shipped; the dev tooling and other OSes' native binaries in
# backend-node/node_modules are not.

appId: com.orbit.browser
productName: Orbit

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - "!**/*.d.ts"
  - "!**/*.tsbuildinfo"
  - package.json

# node_modules is its own entry on purpose: electron-builder skips a node_modules folder found
# *inside* an extraResources directory, so `from: build/backend` alone would ship no dependencies.
extraResources:
  - from: build/backend/dist
    to: backend/dist
  - from: build/backend/node_modules
    to: backend/node_modules
  - from: build/backend/package.json
    to: backend/package.json

asar: true

win:
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
