<text x="84" y="439" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#83569a">loop [until finish, stop, failure, or step limit]</text>
<rect x="68" y="992" width="2064" height="223" fill="#ffffff" stroke="#83569a" stroke-width="2" stroke-dasharray="11 8"/>
