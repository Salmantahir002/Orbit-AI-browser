<rect x="68" y="1015" width="349" height="43" fill="#ffffff" stroke="#83569a" stroke-width="2"/>
<text x="84" y="1036" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#83569a">opt [report explanation]</text>
<line x1="195" y1="280" x2="648" y2="280" stroke="#276487" stroke-width="3"/>
<polygon points="630,270 648,280 630,290" fill="#276487"/>
<text x="421" y="255" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#192b37">1. Select Scan</text>
