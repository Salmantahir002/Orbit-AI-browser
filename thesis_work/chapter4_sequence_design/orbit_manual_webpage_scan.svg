<text x="2005" y="153" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#192b37">Local Security</text>
<text x="2005" y="190" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#192b37">API</text>
